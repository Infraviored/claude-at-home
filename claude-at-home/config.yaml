# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Claude at Home
version: "1.5.1"
slug: claude-at-home
description: Persistent Claude Code session with an ingress-only web terminal in your sidebar
url: "https://github.com/Infraviored/claude-at-home"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 0
ingress_panel: true
panel_icon: mdi:robot
panel_title: Claude at Home
homeassistant_api: true
hassio_api: true
hassio_role: manager
# Lets Claude inspect and manage the Docker layer: which apps are running,
# what is eating disk, image cleanup. Requires the user to turn Protection
# mode off; without that this is simply unavailable and everything else
# still works.
docker_api: true
map:
  - homeassistant_config:rw
options:
  session_name: claude-at-home
  permission_mode: auto
  remote_control: true
  usage_sensors: false
  login_notification: true
  claude_voice:
    enabled: false
    server: ""
    token: ""
    name: homeassistant
schema:
  session_name: "str?"
  permission_mode: "list(auto|bypass permissions|accept edits|plan|manual|never ask)?"
  remote_control: "bool?"
  usage_sensors: "bool?"
  login_notification: "bool?"
  claude_voice:
    enabled: bool
    server: "str?"
    token: "password?"
    name: "str?"
  # 1.4.0's flat options. Kept in the schema (but not in `options`, so they
  # don't show up for new installs) because Supervisor drops every option the
  # schema no longer lists on update - without these a 1.4.0 install lost
  # its server and token on the way to 1.4.1.
  claude_voice_server: "str?"
  claude_voice_token: "password?"
  claude_voice_name: "str?"
# No `image:` on purpose — Supervisor builds this from the Dockerfile in
# place. Add `image:` (plus CI publishing) only when shipping prebuilt.
